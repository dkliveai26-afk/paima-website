<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" fill="none">
  <!-- Paima Orbital Emblem -->
  <g transform="translate(10, 5)">
    <!-- Outer Ellipse Ring 1 -->
    <ellipse cx="32" cy="30" rx="28" ry="18" stroke="#A78D78" stroke-width="2.5" transform="rotate(-25 32 30)" />
    <!-- Outer Ellipse Ring 2 -->
    <ellipse cx="32" cy="30" rx="26" ry="14" stroke="#6E4738" stroke-width="2.2" transform="rotate(35 32 30)" opacity="0.9" />
    <!-- Stylized Inner P Swoosh -->
    <path d="M 20 48 C 22 36, 26 22, 34 14 C 42 14, 46 20, 44 28 C 42 34, 34 38, 24 38 Z" fill="none" stroke="#6E4738" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 22 46 L 30 18" stroke="#6E4738" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="82" y1="14" x2="82" y2="56" stroke="#A78D78" stroke-width="2" opacity="0.8" />

  <!-- Paima Typography -->
  <text x="96" y="48" font-family="'Playfair Display', 'Inter', sans-serif" font-size="38" font-weight="800" font-style="italic" fill="#6E4738" letter-spacing="1">Paima</text>
</svg>
